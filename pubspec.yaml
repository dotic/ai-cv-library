name: ai_cv_library
description: This is a package for image recognition. It can be used with flutter for Android and iOS applications.
version: 1.0.0
homepage: https://github.com/dotic/ai-cv-library
repository: https://github.com/dotic/ai-cv-library
publish_to: 'none'

environment:
  sdk: '>=3.1.2 <4.0.0'

# Add regular dependencies here.
dependencies:
  aws_client: ^0.6.0
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  http: ^1.2.2
  image: ^4.5.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  native_opencv:
    path: native_opencv
  onnxruntime: ^1.4.1
  path_provider: ^2.1.5
  tflite_flutter: ^0.11.0
  tuple: ^2.0.2

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  very_good_analysis: ^5.0.0

flutter:
  assets:
    - assets/
